name: CI

on:
  workflow_dispatch: # 手动触发
    inputs:
      build_type:
        description: '选择构建类型'
        required: true
        default: 'release'
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle 缓存
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 构建项目
        run: |
          
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            chmod +x gradlew

            ./gradlew generateHandbook
            ./gradlew jar
          else
            ./gradlew buildDebug
          fi


      - name: 保存构建工件
        uses: actions/upload-artifact@v3
        with:
          name: built-artifacts
          path: ./*
